<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B1F4B">
<title>IMPARABLE · Líder</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app app--light" id="app">

  <!-- ====== PIN ====== -->
  <section id="screen-pin" style="display:flex;flex-direction:column;flex:1;background:var(--azul-profundo)">
    <header class="appbar appbar--dark">
      <button class="iconbtn" id="pin-back"></button>
      <div class="ab-title"><div class="ab-crumb">Líder</div><div class="ab-where">Ingreso de líder</div></div>
      <div class="ab-right"></div>
    </header>
    <div class="pin-screen" style="padding-top:20px">
      <div class="brand">IMP<span>A</span>RABLE</div>
      <p class="sub">Ingresa tu código de líder</p>
      <div class="pin-dots" id="pin-dots"><span class="d"></span><span class="d"></span><span class="d"></span><span class="d"></span></div>
      <div class="keypad" id="keypad"></div>
      <p class="pin-help">¿No tienes código o lo olvidaste? Pídelo a la directiva.</p>
    </div>
  </section>

  <!-- ====== PANEL ====== -->
  <div id="screen-main" class="hide" style="display:flex;flex-direction:column;flex:1">
    <header class="appbar appbar--dark">
      <button class="iconbtn" id="main-back"></button>
      <div class="ab-title"><div class="ab-crumb">Líder</div><div class="ab-where" id="where">Mi grupo</div></div>
      <div class="ab-right"><span class="badge-team" id="badge"></span></div>
    </header>

    <div class="lt-scroll">
      <div class="grupo-card" id="grupo-card"></div>

      <div class="lt-segment" id="seg">
        <button class="is-active" data-view="resumen">Resumen</button>
        <button data-view="integrantes">Integrantes</button>
        <button data-view="comparacion">Comparación</button>
      </div>

      <div id="view-resumen"></div>
      <div id="view-integrantes" class="hide"></div>
      <div id="view-comparacion" class="hide"></div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="icons.js"></script>
<script src="data.js"></script>
<script>
(async function () {
  await API.init();
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  function isLight(hex){ const c=(hex||'').replace('#',''); if(c.length<6)return false; const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16); return (r*299+g*587+b*114)/1000>150; }
  function discStyle(eq){ const bg=eq.color||'#1A3A8F'; const tx=eq.color_text||(isLight(bg)?'#0B1F4B':'#fff'); return 'background:'+bg+';color:'+tx+';'; }
  function avatar(name){ return (name.match(/\b\w/g)||['?'])[0].toUpperCase(); }
  function fechaCorta(iso){ try { return new Date(iso+'T00:00:00').toLocaleDateString('es', { day:'numeric', month:'short' }); } catch(e){ return iso; } }

  $('pin-back').innerHTML = ICON.back;
  $('main-back').innerHTML = ICON.back;
  $('pin-back').addEventListener('click', () => location.href = 'acceso.html');
  $('main-back').addEventListener('click', () => { pin=''; paintDots(); $('screen-main').classList.add('hide'); $('screen-pin').classList.remove('hide'); });

  /* ---------- PIN ---------- */
  let pin = '', equipo = null;
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  $('keypad').innerHTML = keys.map(k => k === '' ? '<span></span>' : k === '⌫'
    ? '<button class="key key--fn" data-k="del">Borrar</button>' : `<button class="key" data-k="${k}">${k}</button>`).join('');
  function paintDots(){ document.querySelectorAll('#pin-dots .d').forEach((d,i)=>d.classList.toggle('on', i<pin.length)); }
  $('keypad').addEventListener('click', async (e) => {
    const b = e.target.closest('.key'); if (!b) return;
    if (b.dataset.k === 'del') pin = pin.slice(0,-1); else if (pin.length < 4) pin += b.dataset.k;
    paintDots();
    if (pin.length === 4) {
      const eq = await API.verificarPinLider(pin);
      if (eq) { equipo = Object.assign({}, eq, API.equipo(eq.id) || {}); abrirPanel(); }
      else { $('pin-dots').classList.add('err'); setTimeout(()=>{ $('pin-dots').classList.remove('err'); pin=''; paintDots(); }, 450); }
    }
  });

  /* ---------- Panel ---------- */
  const WHERE = { resumen:'Mi grupo', integrantes:'Integrantes', comparacion:'Comparación' };
  const ESTADO = {
    atencion:    { lbl:'Necesita atención', cls:'st--red',  ic:'!' },
    seguimiento: { lbl:'En seguimiento',    cls:'st--gold', ic:'•' },
    bien:        { lbl:'Al día',            cls:'st--green', ic:'✓' },
    sin_datos:   { lbl:'Sin datos aún',     cls:'st--gray', ic:'–' }
  };
  let ind = null;

  function abrirPanel() {
    $('screen-pin').classList.add('hide'); $('screen-main').classList.remove('hide');
    $('badge').textContent = equipo.nombre;
    ind = API.indicadoresEquipo(equipo.id);
    renderCard(); renderResumen(); renderIntegrantes(); renderComparacion();
  }

  $('seg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const v = b.dataset.view;
    document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('is-active', x === b));
    ['resumen','integrantes','comparacion'].forEach(k => $('view-'+k).classList.toggle('hide', k !== v));
    $('where').textContent = WHERE[v];
  });

  function renderCard() {
    const e = equipo, n = API.miembros(e.id).length;
    $('grupo-card').style.setProperty('--team', e.color || '#1A3A8F');
    $('grupo-card').innerHTML = `
      <div class="gc-top">
        <span class="gc-disc" style="${discStyle(e)}">${esc(e.inicial || avatar(e.nombre))}</span>
        <span class="gc-id">
          <span class="gc-name">${esc(e.nombre)}</span>
          <span class="gc-sub">${e.lider_nombre ? 'Líder: ' + esc(e.lider_nombre) + ' · ' : ''}${n} integrante${n===1?'':'s'}</span>
        </span>
        ${ind.posicion ? `<span class="gc-pos"><b>#${ind.posicion}</b><span>${ind.puntos} pts</span></span>` : ''}
      </div>
      ${e.versiculo ? `<div class="gc-line"><span class="gc-k">Versículo</span><span class="gc-v">${esc(e.versiculo)}</span></div>` : ''}
      ${e.grito ? `<div class="gc-line"><span class="gc-k">Grito</span><span class="gc-v gc-grito">“${esc(e.grito)}”</span></div>` : ''}
      <div class="gc-line"><span class="gc-k">Color</span><span class="gc-v"><span class="gc-swatch"></span></span></div>`;
  }

  function kpi(label, val, hint) {
    return `<div class="kpi"><div class="kpi-num">${val == null ? '—' : val + '<small>%</small>'}</div>
      <div class="kpi-lbl">${label}</div>${hint ? `<div class="kpi-hint">${hint}</div>` : ''}</div>`;
  }
  function motivo(m) {
    if (m.racha_ausencias >= 2) return `Faltó a las últimas ${m.racha_ausencias} reuniones`;
    if (m.asistencia != null && m.asistencia < 50) return `Asistencia de ${m.asistencia}%`;
    return '';
  }

  function renderResumen() {
    const g = ind.grupo;
    let h = '';
    if (!ind.reuniones) {
      h += `<div class="empty-state"><div class="es-ic">${ICON.clipboard}</div>
        <div class="es-tt">Aún no hay reuniones registradas</div>
        <div class="es-sb">Cuando el secretario de tu grupo envíe el primer registro, aquí verás la asistencia, puntualidad y retos de cada integrante.</div></div>`;
    } else {
      h += `<div class="kpi-row">
        ${kpi('Asistencia', g.asistencia)}
        ${kpi('Puntualidad', g.puntualidad)}
        ${kpi('Retos', g.reto)}
      </div>
      <p class="lt-note">Promedio del grupo en ${ind.reuniones} reunión${ind.reuniones===1?'':'es'} registrada${ind.reuniones===1?'':'s'}.</p>`;

      // Necesitan atención
      h += `<div class="lt-group-head" style="margin-top:18px"><span class="left">${ICON.shield} Necesitan atención</span>
        <span class="pill ${ind.atencion.length ? 'pill--red' : ''}">${ind.atencion.length}</span></div>`;
      h += ind.atencion.length
        ? ind.atencion.map(m => `<div class="member-row"><div class="avatar">${avatar(m.nombre)}</div>
            <span class="member-name">${esc(m.nombre)}<span class="member-sub">${motivo(m)}</span></span>
            <span class="st st--red"><i>!</i>Atención</span></div>`).join('')
        : `<div class="ok-note">${ICON.check} Nadie está descuidado por ahora. ¡Buen trabajo!</div>`;

      // Asistencia por reunión
      const max = Math.max(1, ...ind.semanas.map(s => s.total || 0));
      h += `<div class="lt-group-head" style="margin-top:18px"><span class="left">${ICON.users} Asistencia por reunión</span></div>
        <div class="wk-chart" role="img" aria-label="Asistencia por reunión">
          ${ind.semanas.map(s => {
            const p = s.total ? Math.round((s.presentes / s.total) * 100) : 0;
            return `<div class="wk-col" title="${fechaCorta(s.fecha)}: ${s.presentes} de ${s.total} presentes (${p}%)">
              <span class="wk-val">${s.presentes}/${s.total}</span>
              <span class="wk-track"><span class="wk-bar" style="height:${Math.max(4, (s.presentes / max) * 100)}%"></span></span>
              <span class="wk-lbl">${fechaCorta(s.fecha)}</span></div>`;
          }).join('')}
        </div>
        <table class="sr-only"><caption>Asistencia por reunión</caption><tr><th>Fecha</th><th>Presentes</th><th>Total</th></tr>
          ${ind.semanas.map(s => `<tr><td>${s.fecha}</td><td>${s.presentes}</td><td>${s.total}</td></tr>`).join('')}</table>`;
    }

    // Indicadores por definir
    h += `<div class="lt-group-head" style="margin-top:18px"><span class="left">${ICON.star} Próximos indicadores</span></div>
      <div class="soon-row"><b>Trabajo misionero</b><span>Necesidades identificadas, personas por las que se oró y más.</span><em>Por definir</em></div>
      <div class="soon-row"><b>Actividades propuestas</b><span>Participación de cada integrante en las actividades.</span><em>Por definir</em></div>`;
    $('view-resumen').innerHTML = h;
  }

  function barra(label, val, detalle) {
    return `<div class="mb-row"><span class="mb-lbl">${label}</span>
      <span class="mb-track"><span class="mb-fill" style="width:${val == null ? 0 : val}%"></span></span>
      <span class="mb-val">${val == null ? '—' : val + '%'}</span>
      ${detalle ? `<span class="mb-det">${detalle}</span>` : ''}</div>`;
  }

  function renderIntegrantes() {
    const orden = { atencion:0, seguimiento:1, bien:2, sin_datos:3 };
    const list = ind.miembros.slice().sort((a, b) => orden[a.estado] - orden[b.estado] || a.nombre.localeCompare(b.nombre));
    if (!list.length) {
      $('view-integrantes').innerHTML = `<div class="empty-state"><div class="es-ic">${ICON.users}</div>
        <div class="es-tt">Tu grupo aún no tiene integrantes</div>
        <div class="es-sb">El secretario los agrega al crear el equipo. Si falta alguien, avísale a la directiva.</div></div>`;
      return;
    }
    $('view-integrantes').innerHTML = `<p class="lt-note" style="margin-top:0">Ordenados por prioridad: primero quienes necesitan atención.</p>` +
      list.map(m => {
        const st = ESTADO[m.estado];
        const dots = m.ultimas.length
          ? `<div class="mb-dots"><span class="mb-lbl">Últimas reuniones</span>${m.ultimas.map(a =>
              `<i class="dot ${a ? 'dot--on' : 'dot--off'}" title="${a ? 'Asistió' : 'Faltó'}">${a ? '✓' : '✕'}</i>`).join('')}</div>` : '';
        return `<div class="mcard">
          <div class="mcard-head"><div class="avatar">${avatar(m.nombre)}</div>
            <span class="member-name">${esc(m.nombre)}${motivo(m) ? `<span class="member-sub">${motivo(m)}</span>` : ''}</span>
            <span class="st ${st.cls}"><i>${st.ic}</i>${st.lbl}</span></div>
          ${m.reuniones ? `
            ${barra('Asistencia', m.asistencia, `${m.presentes} de ${m.reuniones}`)}
            ${barra('Puntualidad', m.puntualidad, m.presentes ? '' : 'sin asistencias')}
            ${barra('Retos', m.reto, m.retos_total ? `${m.retos} de ${m.retos_total}` : 'sin retos individuales')}
            ${dots}` : `<p class="lt-note" style="margin:6px 0 0">Todavía no hay registros con su asistencia.</p>`}
        </div>`;
      }).join('');
  }

  function renderComparacion() {
    const r = ind.ranking;
    $('view-comparacion').innerHTML = `<p class="lt-note" style="margin-top:0">Puntaje acumulado de todos los grupos. El tuyo está resaltado.</p>` +
      (r.length ? r.map(f => `<div class="team-row ${f.id === equipo.id ? 'team-row--me' : ''}">
          <span class="cmp-pos">#${f.pos}</span>
          <span class="tr-disc" style="${discStyle(f)}">${esc(f.inicial)}</span>
          <span class="tr-body"><span class="tr-name">${esc(f.nombre)}${f.id === equipo.id ? ' · tu grupo' : ''}</span>
            <span class="tr-pin">${f.miembros} integrantes</span></span>
          <span class="cmp-pts">${f.puntos}<small> pts</small></span></div>`).join('')
        : `<div class="empty-state"><div class="es-tt">Aún no hay equipos en el ranking</div></div>`);
  }
})();
</script>
</body>
</html>
